version: '3.8'

services:
  db-server:
    image: postgres:16-alpine
    container_name: nicalogistics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nicalogistics_db
      POSTGRES_USER: nicalogistics_user
      POSTGRES_PASSWORD: NicaLogisticsSecure2026!
    # No ports exposed to host, ensuring DB isolation (accessed only by backend-api via internal-net)
    networks:
      - internal-net
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicalogistics_user -d nicalogistics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nicalogistics-backend
    restart: unless-stopped
    depends_on:
      db-server:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db-server;Port=5432;Database=nicalogistics_db;Username=nicalogistics_user;Password=NicaLogisticsSecure2026!
      - Jwt__Key=NicaLogisticsUltraSecureJwtSecretKey2026!EnterpriseGrade
      - Jwt__Issuer=NicaLogistics
      - Jwt__Audience=NicaLogisticsUsers
    ports:
      - "5000:5000"
    networks:
      - internal-net
      - web-net
    volumes:
      - image_uploads:/app/uploads

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nicalogistics-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    networks:
      - web-net

networks:
  internal-net:
    driver: bridge
  web-net:
    driver: bridge

volumes:
  db_data:
    name: nicalogistics_db_data
  image_uploads:
    name: nicalogistics_uploads
