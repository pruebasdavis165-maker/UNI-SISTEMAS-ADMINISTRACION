services:
  db-server:
    image: postgres:16-alpine
    container_name: nicalogistics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nicalogistics_db
      POSTGRES_USER: nicalogistics_user
      POSTGRES_PASSWORD: NicaLogisticsSecure2026!
    # No ports exposed to host, ensuring DB isolation (accessed only by backend-api via internal-net)
    networks:
      - internal-net
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicalogistics_user -d nicalogistics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    container_name: nicalogistics-db-backup
    restart: unless-stopped
    depends_on:
      db-server:
        condition: service_healthy
    environment:
      - DB_HOST=db-server
      - POSTGRES_DB=nicalogistics_db
      - POSTGRES_USER=nicalogistics_user
      - POSTGRES_PASSWORD=NicaLogisticsSecure2026!
      - BACKUP_DIR=/backups
    networks:
      - internal-net
    volumes:
      - db_backups:/backups
      - ./scripts/backup-database.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl gzip bash && echo '0 2 * * * /bin/bash /backup.sh' > /etc/crontabs/root && /bin/bash /backup.sh && crond -f -l 2"]

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nicalogistics-backend
    restart: unless-stopped
    depends_on:
      db-server:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db-server;Port=5432;Database=nicalogistics_db;Username=nicalogistics_user;Password=NicaLogisticsSecure2026!
      - Jwt__Key=NicaLogisticsUltraSecureJwtSecretKey2026!EnterpriseGrade
      - Jwt__Issuer=NicaLogistics
      - Jwt__Audience=NicaLogisticsUsers
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Resend__ApiKey=${RESEND_API_KEY}
      - Resend__FromEmail=${RESEND_FROM_EMAIL:-NicaLogistics <onboarding@resend.dev>}
      - Resend__AdminEmail=${RESEND_ADMIN_EMAIL:-admin@nicalogistics.com}
    expose:
      - "5000"
    networks:
      - internal-net
      - web-net
    volumes:
      - image_uploads:/app/uploads

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nicalogistics-frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://localhost
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_51UVcGVJcW9DVnNYE38WIwMT2fDA2uq2jFcHoJ0mT5wUN28uBgr1rNXMEuwpcVsPvBnc9J0bXSkwxTygSMpDUA1Pe00wrBlwINN}
    expose:
      - "3000"
    networks:
      - web-net

  reverse-proxy:
    image: nginx:alpine
    container_name: nicalogistics-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - web-net
    depends_on:
      - backend-api
      - frontend-web

networks:
  internal-net:
    driver: bridge
  web-net:
    driver: bridge

volumes:
  db_data:
    name: nicalogistics_db_data
  image_uploads:
    name: nicalogistics_uploads
  db_backups:
    name: nicalogistics_db_backups
